<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathMaster THCS — Nền tảng Luyện thi & Học Toán Lớp 6, 7, 8, 9</title>
  <script src="https://cdn.tailwindcss.com/3.4.17" async></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
  <style>
    :root {
      --bg-app: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-muted: #F1F5F9;
      --bg-hover: #E2E8F0;
      --text-main: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-soft: #EFF6FF;
      --purple: #7C3AED;
      --purple-soft: #F5F3FF;
      --emerald: #059669;
      --emerald-soft: #ECFDF5;
      --amber: #D97706;
      --amber-soft: #FFFBEB;
      --rose: #E11D48;
      --rose-soft: #FFF1F2;
      --sidebar-w: 260px;
      --header-h: 64px;
      --radius-card: 14px;
      --radius-btn: 10px;
      --shadow-card: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    html.dark {
      --bg-app: #0B1120;
      --bg-surface: #1E293B;
      --bg-muted: #0F172A;
      --bg-hover: #334155;
      --text-main: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --border-color: #334155;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --purple-soft: rgba(124, 58, 237, 0.15);
      --emerald-soft: rgba(16, 185, 129, 0.15);
      --amber-soft: rgba(245, 158, 11, 0.15);
      --rose-soft: rgba(244, 63, 94, 0.15);
      --shadow-card: 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 14px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell { display: flex; min-height: 100vh; width: 100%; }
    .app-sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      max-width: var(--sidebar-w);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 40;
      transition: width 0.2s ease, transform 0.2s ease;
      user-select: none;
    }
    .app-sidebar.collapsed { width: 72px; min-width: 72px; max-width: 72px; }
    .app-sidebar.collapsed .sidebar-label,
    .app-sidebar.collapsed .sidebar-section-title,
    .app-sidebar.collapsed .logo-text-wrap,
    .app-sidebar.collapsed .sidebar-footer-text { display: none !important; }
    .app-sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
    .app-sidebar.collapsed .sidebar-logo-box { justify-content: center; padding: 0 12px; }

    .sidebar-logo-box {
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 12px 4px 12px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      height: 40px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      width: 100%;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover { background-color: var(--bg-muted); color: var(--text-main); }
    .nav-item.active {
      background-color: var(--primary);
      color: #FFFFFF;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.28);
    }
    .nav-item .nav-icon {
      width: 20px; height: 20px; min-width: 20px;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-item .sidebar-label {
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 20px;
    }
    .nav-badge {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background-color: var(--bg-muted); color: var(--text-secondary); flex-shrink: 0;
    }
    .nav-item.active .nav-badge { background-color: rgba(255, 255, 255, 0.22); color: #FFFFFF; }

    .app-main-wrap {
      flex: 1; margin-left: var(--sidebar-w); min-width: 0;
      display: flex; flex-direction: column; min-height: 100vh;
      transition: margin-left 0.2s ease;
    }
    .app-main-wrap.sidebar-collapsed { margin-left: 72px; }

    .app-header {
      height: var(--header-h); min-height: var(--header-h);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; gap: 16px;
    }

    .app-content-container {
      width: 100%; max-width: 1320px; margin: 0 auto; padding: 24px; flex: 1;
    }

    .mm-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
    .mm-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
    .mm-grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }

    .mm-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 20px;
      display: flex; flex-direction: column; justify-content: space-between;
      height: 100%; min-width: 0; overflow: hidden;
    }
    .mm-card-static {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 20px; min-width: 0;
    }

    .mm-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 38px; padding: 0 16px; border-radius: var(--radius-btn);
      font-size: 13.5px; font-weight: 600; line-height: 1;
      border: 1px solid transparent; cursor: pointer; white-space: nowrap;
      transition: all 0.15s ease; flex-shrink: 0;
    }
    .mm-btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; }
    .mm-btn-lg { height: 44px; padding: 0 22px; font-size: 14.5px; border-radius: 12px; }
    .mm-btn-primary { background-color: var(--primary); color: #FFFFFF; }
    .mm-btn-primary:hover { background-color: var(--primary-hover); }
    .mm-btn-purple { background-color: var(--purple); color: #FFFFFF; }
    .mm-btn-emerald { background-color: var(--emerald); color: #FFFFFF; }
    .mm-btn-amber { background-color: var(--amber); color: #FFFFFF; }
    .mm-btn-outline { background-color: var(--bg-surface); border-color: var(--border-color); color: var(--text-main); }
    .mm-btn-outline:hover { background-color: var(--bg-muted); }
    .mm-btn-danger { background-color: var(--rose-soft); color: var(--rose); border-color: rgba(225, 29, 72, 0.25); }
    .mm-btn-danger:hover { background-color: var(--rose); color: #FFFFFF; }

    .mm-input, .mm-select, .mm-textarea {
      width: 100%; background-color: var(--bg-surface); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: var(--radius-btn);
      font-size: 14px; padding: 8px 12px;
    }
    .mm-input, .mm-select { height: 38px; }
    .mm-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }

    .mm-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    }
    .badge-blue { background: var(--primary-soft); color: var(--primary); }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-rose { background: var(--rose-soft); color: var(--rose); }
    .badge-gray { background: var(--bg-muted); color: var(--text-secondary); }

    .math-inline {
      font-family: 'Cambria Math', 'Latin Modern Math', 'Times New Roman', serif;
      font-style: italic; font-weight: 600;
      display: inline; padding: 0 2px;
    }
    .math-inline sup { font-size: 0.75em; vertical-align: super; line-height: 0; font-style: normal; }
    .math-inline sub { font-size: 0.75em; vertical-align: sub; line-height: 0; font-style: normal; }
    .math-frac {
      display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle;
      font-size: 0.9em; margin: 0 3px; line-height: 1.1;
    }
    .math-frac .num { border-bottom: 1.2px solid currentColor; padding: 0 3px 1px 3px; font-style: normal; }
    .math-frac .den { padding: 1px 3px 0 3px; font-style: normal; }
    .math-sqrt { display: inline-flex; align-items: center; vertical-align: middle; font-style: normal; }
    .math-sqrt .rad-sym { font-size: 1.1em; margin-right: 1px; }
    .math-sqrt .radicand { border-top: 1.2px solid currentColor; padding: 0 2px; }
    .math-cases {
      display: inline-flex; align-items: center; vertical-align: middle;
      border-left: 2.5px solid currentColor; border-radius: 4px 0 0 4px;
      padding-left: 6px; margin: 2px 4px; font-style: normal; font-size: 0.92em;
    }

    .mm-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border-color); border-radius: 12px; }
    .mm-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    .mm-table th { background-color: var(--bg-muted); color: var(--text-secondary); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .mm-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .mm-table tr:last-child td { border-bottom: none; }

    .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .mm-progress-track { width: 100%; height: 8px; background-color: var(--bg-muted); border-radius: 999px; overflow: hidden; }
    .mm-progress-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }

    .mm-modal-backdrop {
      position: fixed; inset: 0; background-color: rgba(15, 23, 42, 0.55);
      z-index: 60; display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .mm-modal-backdrop.open { display: flex; }
    .mm-modal-box {
      background-color: var(--bg-surface); border: 1px solid var(--border-color);
      border-radius: 16px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto;
      padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
    }

    #mm-toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 80;
      display: flex; flex-direction: column; gap: 8px; max-width: 360px;
    }
    #sidebar-mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 35; }

    @media (max-width: 1024px) {
      .mm-grid-4, .mm-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .exam-room-grid { grid-template-columns: minmax(0, 1fr) !important; }
      .app-sidebar { transform: translateX(-100%); }
      .app-sidebar.mobile-open { transform: translateX(0); width: 260px !important; min-width: 260px !important; }
      #sidebar-mobile-overlay.open { display: block; }
      .app-main-wrap, .app-main-wrap.sidebar-collapsed { margin-left: 0 !important; }
      .app-header { padding: 0 16px; }
      .app-content-container { padding: 16px; }
    }

    @media (max-width: 640px) {
      .mm-grid-4, .mm-grid-3, .mm-grid-2 { grid-template-columns: minmax(0, 1fr); }
      .hide-on-mobile { display: none !important; }
      .mm-btn { height: 40px; }
    }

    @media print {
      .app-sidebar, .app-header, .no-print, #mm-toast-container { display: none !important; }
      .app-main-wrap { margin-left: 0 !important; }
      body { background: #FFFFFF !important; color: #000000 !important; }
    }
  </style>
</head>
<body>
  <div id="sidebar-mobile-overlay" onclick="toggleMobileSidebar(false)"></div>

  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Điều hướng chính">
      <div class="sidebar-logo-box">
        <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#7C3AED);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 6px rgba(37,99,235,0.3);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>

        <div class="logo-text-wrap" style="min-width:0;">
          <div style="font-size:15.5px;font-weight:800;letter-spacing:-0.02em;color:var(--text-main);line-height:1.2;">MathMaster THCS</div>
          <div style="font-size:11.5px;font-weight:500;color:var(--text-muted);line-height:1.2;">Luyện Toán 6 • 7 • 8 • 9</div>
        </div>
      </div>

      <nav class="sidebar-nav-scroll" id="sidebar-nav-list">
        <button type="button" class="nav-item active" data-nav="dashboard" onclick="navigateTo('dashboard')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span>
          <span class="sidebar-label">Tổng quan</span>

        <div class="sidebar-section-title">Khối lớp học</div>

        <button type="button" class="nav-item" data-nav="grade-6" onclick="navigateTo('grade-6')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="sidebar-label">Lớp 6</span>
          <span class="nav-badge sidebar-label">6 chương</span>
        </button>

        <button type="button" class="nav-item" data-nav="grade-7" onclick="navigateTo('grade-7')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="sidebar-label">Lớp 7</span>
          <span class="nav-badge sidebar-label">6 chương</span>
        </button>

        <button type="button" class="nav-item" data-nav="grade-8" onclick="navigateTo('grade-8')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="sidebar-label">Lớp 8</span>
          <span class="nav-badge sidebar-label">5 chương</span>
        </button>

        <button type="button" class="nav-item" data-nav="grade-9" onclick="navigateTo('grade-9')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="sidebar-label">Lớp 9</span>
          <span class="nav-badge sidebar-label">Thi vào 10</span>
        </button>

        <div class="sidebar-section-title">Luyện thi & Tài liệu</div>

        <button type="button" class="nav-item" data-nav="exam-generator" onclick="navigateTo('exam-generator')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="sidebar-label">Tạo đề thi</span>
        </button>

        <button type="button" class="nav-item" data-nav="exam-bank" onclick="navigateTo('exam-bank')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
          <span class="sidebar-label">Kho đề thi</span>
        </button>

        <button type="button" class="nav-item" data-nav="documents" onclick="navigateTo('documents')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
          <span class="sidebar-label">Tài liệu của tôi</span>
        </button>

        <button type="button" class="nav-item" data-nav="history" onclick="navigateTo('history')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span class="sidebar-label">Lịch sử làm bài</span>
        </button>

        <div class="sidebar-section-title">Phân tích & Bổ trợ</div>

        <button type="button" class="nav-item" data-nav="analytics" onclick="navigateTo('analytics')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>
          <span class="sidebar-label">Phân tích học tập</span>
        </button>

        <button type="button" class="nav-item" data-nav="review" onclick="navigateTo('review')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
          <span class="sidebar-label">Ôn tập kiến thức yếu</span>
          <span id="sidebar-review-badge" class="nav-badge sidebar-label">0</span>
        </button>

        <button type="button" class="nav-item" data-nav="formulas" onclick="navigateTo('formulas')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></span>
          <span class="sidebar-label">Công thức Toán</span>
        </button>

        <button type="button" class="nav-item" data-nav="achievements" onclick="navigateTo('achievements')">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg></span>
          <span class="sidebar-label">Thành tích và huy hiệu</span>

      try { localStorage.setItem(key, val); return true; } catch (e) { return false; }

    function saveToIndexedDB(dataObj) {
      try {
        if (!window.indexedDB) return;
        const req = window.indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function(ev) {
          const db = ev.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function(ev) {
          try {
            const db = ev.target.result;
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(JSON.stringify(dataObj), 'main');
          } catch (err) {}
        };
      } catch (e) {}
    }

    // Math Formatter
    function convertLatexSegmentToHTML(latex) {
      if (!latex) return '';
      if (window.katex && typeof window.katex.renderToString === 'function') {
        try { return window.katex.renderToString(latex, { throwOnError: false, displayMode: false }); } catch (e) {}
      }
      let s = latex;
      s = s.replace(/\\begin\{cases\}([\s\S]*?)\\end\{cases\}/g, function(_, inner) {
        const rows = inner.split(/\\\\/).map(r => r.replace(/&/g, ' ').trim()).filter(Boolean);
        return '<span class="math-cases">' + rows.join('<br>') + '</span>';
      });
      s = s.replace(/\\text\s*\{([^}]*)\}/g, '<span style="font-style:normal;font-family:Inter,sans-serif;">$1</span>');
      s = s.replace(/\\mathbb\{([A-Z])\}/g, '<strong style="font-style:normal;">$1</strong>');
      s = s.replace(/\\widehat\{([^}]+)\}/g, '<span style="border-top:1px solid currentColor;padding-top:1px;">&ang;$1</span>');
      for (let i = 0; i < 3; i++) {
        s = s.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '<span class="math-frac"><span class="num">$1</span><span class="den">$2</span></span>');
      }
      s = s.replace(/\\sqrt\s*\{([^{}]+)\}/g, '<span class="math-sqrt"><span class="rad-sym">&radic;</span><span class="radicand">$1</span></span>');
      s = s.replace(/\^\s*\{([^{}]+)\}/g, '<sup>$1</sup>');
      s = s.replace(/\^([0-9a-zA-Z\+\-\\circ]+)/g, function(_, exp) {
        if (exp === '\\circ') return '&deg;';
        return '<sup>' + exp.replace('\\circ', '&deg;') + '</sup>';
      });
      s = s.replace(/_\s*\{([^{}]+)\}/g, '<sub>$1</sub>');
      s = s.replace(/_([0-9a-zA-Z]+)/g, '<sub>$1</sub>');

      const symMap = {
        '\\cdot': '&middot;', '\\times': '&times;', '\\div': '&divide;', '\\pm': '&plusmn;', '\\mp': '&#8723;',
        '\\leq': '&le;', '\\geq': '&ge;', '\\neq': '&ne;', '\\approx': '&asymp;', '\\Leftrightarrow': '&hArr;',
        '\\Rightarrow': '&rArr;', '\\in': '&isin;', '\\notin': '&notin;', '\\subset': '&sub;', '\\cup': '&cup;',
        '\\cap': '&cap;', '\\forall': '&forall;', '\\triangle': '&#9651;', '\\perp': '&perp;', '\\pi': '&pi;',
        '\\Delta': '&Delta;', '\\alpha': '&alpha;', '\\beta': '&beta;', '\\dots': '&hellip;', '\\quad': '&nbsp;&nbsp;',
        '\\,': ' ', '\\{': '{', '\\}': '}', '\\%': '%', '\\mid': '|'
      };
      for (const [k, v] of Object.entries(symMap)) {
        s = s.split(k).join(v);
      }
      return '<span class="math-inline">' + s + '</span>';
    }

    function formatMathText(text) {
      if (text === null || text === undefined) return '';
      return String(text).replace(/\$([^\$]+)\$/g, function(_, mathInner) {
        return convertLatexSegmentToHTML(mathInner);
      }).replace(/\n/g, '<br>');
    }

    // Mathematical Equivalence Grader
    function normalizeMathExpression(raw) {
      if (!raw) return '';
      let s = String(raw).trim().toLowerCase();
      s = s.replace(/\\frac\s*\{([^}]+)\}\s*\{([^}]+)\}/g, '($1)/($2)');
      s = s.replace(/\\sqrt\s*\{([^}]+)\}/g, 'sqrt($1)');
      s = s.replace(/√\s*\(?([0-9]+)\)?/g, 'sqrt($1)');
      s = s.replace(/căn\s*([0-9]+)/g, 'sqrt($1)');
      s = s.replace(/(\d),(\d)/g, '$1.$2');
      s = s.replace(/\\pi/g, 'pi');
      s = s.replace(/\b(cm2|cm3|cm|m2|m|km|đồng|dong|viên|vien|học sinh|hoc sinh|giờ|gio|độ)\b/g, '');
      s = s.replace(/°|\^\\circ/g, '');
      return s.trim();
    }

    function evalMathAtom(expr) {
      if (!expr) return null;
      let clean = normalizeMathExpression(expr)
        .replace(/^(x_1|x_2|x1|x2|x|y|m|n|b|p|q|a|s|min\s*[a-z]+)\s*=\s*/i, '')
        .replace(/[{}()]/g, '')
        .trim();
      if (!clean) return null;
      if (/^[+-]?\d+(\.\d+)?$/.test(clean)) return parseFloat(clean);
      const fMatch = clean.match(/^([+-]?\d+(?:\.\d+)?)\s*\/\s*([+-]?\d+(?:\.\d+)?)$/);
      if (fMatch) {
        const den = parseFloat(fMatch[2]);
        return den === 0 ? null : parseFloat(fMatch[1]) / den;
      }
      const rMatch = clean.match(/^([+-]?\d+(?:\.\d+)?)?\s*\*?\s*sqrt\s*\(?(\d+(?:\.\d+)?)\)?$/);
      if (rMatch) {
        const coef = rMatch[1] ? parseFloat(rMatch[1]) : 1;
        return coef * Math.sqrt(parseFloat(rMatch[2]));
      }
      const piMatch = clean.match(/^([+-]?\d+(?:\.\d+)?)\s*\*?\s*pi$/);
      if (piMatch) return parseFloat(piMatch[1]) * Math.PI;
      return null;
    }

    function checkMathEquivalence(studentAns, question) {
      if (!studentAns || !String(studentAns).trim()) {
        return { isCorrect: false, matchedReason: 'Chưa trả lời', errorCategory: null };
      }
      const sRaw = String(studentAns).trim();
      const targets = [question.correctAnswer].concat(question.acceptedAnswers || []).filter(Boolean);
      const normS = normalizeMathExpression(sRaw);

      for (const t of targets) {
        const normT = normalizeMathExpression(t);
        if (normS === normT || normS.replace(/\s+/g, '') === normT.replace(/\s+/g, '')) {
          return { isCorrect: true, matchedReason: 'Khớp đáp án chuẩn / tương đương', errorCategory: null };
        }
        const vS = evalMathAtom(normS);
        const vT = evalMathAtom(normT);
        if (vS !== null && vT !== null && Math.abs(vS - vT) < 1e-6) {
          return { isCorrect: true, matchedReason: 'Giá trị toán học tương đương (' + sRaw + ' = ' + t + ')', errorCategory: null };
        }
      }

      const isOrderedPair = /x\s*=.*y\s*=/.test(String(question.correctAnswer).toLowerCase());
      if (!isOrderedPair && (String(question.correctAnswer).includes(';') || sRaw.includes(';'))) {
        const parseSet = str => String(str).split(/[;,]/).map(p => evalMathAtom(p)).filter(v => v !== null).sort((a, b) => a - b);
        const sSet = parseSet(sRaw);
        const tSet = parseSet(question.correctAnswer);
        if (sSet.length > 1 && sSet.length === tSet.length && sSet.every((v, i) => Math.abs(v - tSet[i]) < 1e-6)) {
          return { isCorrect: true, matchedReason: 'Tập nghiệm tương đương', errorCategory: null };
        }
      }

      let detectedError = 'CALCULATION_ERROR';
      if (question.id === 'Q9_008' && sRaw.includes('-5')) detectedError = 'MISSING_CONDITION';
      else if (sRaw.length > 25) detectedError = 'METHOD_ERROR';
      return { isCorrect: false, matchedReason: 'Chưa khớp đáp án chuẩn', errorCategory: detectedError };
    }

    // Analytics Engine
    function computeUserGradeStats(userId, gradeNum) {
      const userAttempts = APP_STATE.attempts.filter(a => a.userId === userId && Number(a.grade) === Number(gradeNum));
      const gradedAttempts = userAttempts.filter(a => a.status === 'GRADED');
      const inProgressAttempt = userAttempts.find(a => a.status === 'IN_PROGRESS') || null;

      let totalScoreSum = 0, totalCorrect = 0, totalAnswered = 0;
      const chapterStats = {}, topicStats = {};
      const gradeMeta = getGradeMeta(gradeNum);

      gradeMeta.chapters.forEach(ch => {
        chapterStats[ch.id] = { chapterId: ch.id, title: ch.title, semester: ch.semester, done: 0, correct: 0, accuracy: 0, masteryLabel: 'Chưa có đủ dữ liệu', masteryBadge: 'badge-gray' };
        ch.topics.forEach(tp => {
          topicStats[tp] = { topic: tp, chapterId: ch.id, chapterTitle: ch.title, semester: ch.semester, done: 0, correct: 0, accuracy: 0, masteryCode: 'INSUFFICIENT_DATA', masteryLabel: 'Chưa có đủ dữ liệu', masteryBadge: 'badge-gray' };
        });
      });

      gradedAttempts.forEach(att => {
        totalScoreSum += Number(att.totalScore || 0);
        const exam = APP_STATE.exams.find(e => e.id === att.examId);
        const qIds = exam ? exam.questionIds : Object.keys(att.answers || {});
        qIds.forEach(qid => {
          const q = APP_STATE.questions.find(item => item.id === qid);
          if (!q || Number(q.grade) !== Number(gradeNum)) return;
          const ansObj = att.answers ? att.answers[qid] : null;
          const isRight = Boolean(ansObj && ansObj.isCorrect);
          totalAnswered += 1;
          if (isRight) totalCorrect += 1;
          if (chapterStats[q.chapterId]) {
            chapterStats[q.chapterId].done += 1;
            if (isRight) chapterStats[q.chapterId].correct += 1;
          }
          if (!topicStats[q.topic]) {
            topicStats[q.topic] = { topic: q.topic, chapterId: q.chapterId, chapterTitle: q.chapterId, semester: q.semester, done: 0, correct: 0, accuracy: 0, masteryCode: 'INSUFFICIENT_DATA', masteryLabel: 'Chưa có đủ dữ liệu', masteryBadge: 'badge-gray' };
          }
          topicStats[q.topic].done += 1;
          if (isRight) topicStats[q.topic].correct += 1;
        });
      });

      Object.values(chapterStats).forEach(cs => {
        if (cs.done === 0) {
          cs.accuracy = 0; cs.masteryLabel = 'Chưa có đủ dữ liệu'; cs.masteryBadge = 'badge-gray';
        } else {
          cs.accuracy = Math.round((cs.correct / cs.done) * 100);
          if (cs.done < 2) { cs.masteryLabel = 'Chưa có đủ dữ liệu (' + cs.done + ' câu)'; cs.masteryBadge = 'badge-gray'; }
          else if (cs.accuracy < 55) { cs.masteryLabel = 'Cần củng cố'; cs.masteryBadge = 'badge-rose'; }
          else if (cs.accuracy < 80) { cs.masteryLabel = 'Đang tiến bộ'; cs.masteryBadge = 'badge-amber'; }
          else { cs.masteryLabel = 'Đã nắm vững'; cs.masteryBadge = 'badge-emerald'; }
        }
      });

      Object.values(topicStats).forEach(ts => {
        if (ts.done < 2) {
          ts.accuracy = ts.done === 1 ? (ts.correct * 100) : 0;
          ts.masteryCode = 'INSUFFICIENT_DATA'; ts.masteryLabel = 'Chưa có đủ dữ liệu'; ts.masteryBadge = 'badge-gray';
        } else {
          ts.accuracy = Math.round((ts.correct / ts.done) * 100);
          if (ts.accuracy < 55) { ts.masteryCode = 'NEEDS_WORK'; ts.masteryLabel = 'Cần củng cố'; ts.masteryBadge = 'badge-rose'; }
          else if (ts.accuracy < 80) { ts.masteryCode = 'PROGRESSING'; ts.masteryLabel = 'Đang tiến bộ'; ts.masteryBadge = 'badge-amber'; }
          else { ts.masteryCode = 'MASTERED'; ts.masteryLabel = 'Đã nắm vững'; ts.masteryBadge = 'badge-emerald'; }
        }
      });

      const userReviews = APP_STATE.reviewQueue.filter(r => r.userId === userId && !r.resolved);
      const weakTopicsList = Object.values(topicStats).filter(ts => ts.masteryCode === 'NEEDS_WORK' || ts.masteryCode === 'PROGRESSING');
      userReviews.forEach(rev => {
        const q = APP_STATE.questions.find(item => item.id === rev.questionId);
        if (q && Number(q.grade) === Number(gradeNum) && !weakTopicsList.some(w => w.topic === q.topic)) {
          weakTopicsList.push({
            topic: q.topic, chapterId: q.chapterId, chapterTitle: (getChapterMeta(q.chapterId) || {}).title || q.chapterId,
            semester: q.semester, done: 1, correct: 0, accuracy: 0, masteryCode: 'NEEDS_WORK', masteryLabel: 'Có câu sai cần ôn', masteryBadge: 'badge-rose'
          });
        }
      });

      return {
        completedExamsCount: gradedAttempts.length,
        avgScore: gradedAttempts.length > 0 ? Number((totalScoreSum / gradedAttempts.length).toFixed(2)) : 0,
        accuracyPercent: totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0,
        totalAnswered, totalCorrect, inProgressAttempt, gradedAttempts,
        chapterStats: Object.values(chapterStats),
        topicStats: Object.values(topicStats),
        weakTopicsList
      };
    }

        'LUYEN_CHU_DE': 'Đề luyện theo chủ đề', 'THI_VAO_10': 'Đề thi thử vào lớp 10 THPT'

    function generateControlledExam(config) {
      const user = getCurrentUser();
      const grade = Number(config.grade || user.currentGrade || 8);
      const textbook = config.textbook || user.preferredBook || 'KNTT';
      const category = config.category || 'GIUA_KI_1';
      const difficulty = config.difficulty || 'medium';
      const format = config.format || 'combined';
      const totalCount = Math.max(3, Math.min(12, Number(config.questionCount || 6)));
      const durationMinutes = Number(config.durationMinutes || 45);
      const chapterFilter = config.chapterId || 'ALL';
      const mode = config.generationMode || 'NEW';
      const sourceMode = config.sourceMode || 'STANDARD_BANK';

      let semConstraint = Number(config.semester || 1);
      if (category === 'GIUA_KI_1' || category === 'CUOI_KI_1') semConstraint = 1;
      if (category === 'GIUA_KI_2' || category === 'CUOI_KI_2') semConstraint = 2;
      if (category === 'THI_VAO_10') semConstraint = 0;

      let pool = APP_STATE.questions.filter(q => Number(q.grade) === grade && q.verificationStatus === 'verified');
      if (sourceMode === 'ONLY_DOCS') {
        const docPool = pool.filter(q => Boolean(q.sourceDocId));
        if (docPool.length > 0) pool = docPool;
      }
      if (semConstraint === 1 || semConstraint === 2) {
        const semPool = pool.filter(q => Number(q.semester) === semConstraint);
        if (semPool.length >= 3) pool = semPool;
      }
      if (chapterFilter && chapterFilter !== 'ALL') {
        const chPool = pool.filter(q => q.chapterId === chapterFilter);
        if (chPool.length >= 2) pool = chPool;
      }

      const recentExams = APP_STATE.exams.filter(e => e.userId === user.id && Number(e.grade) === grade).slice(-2);
      const recentQIds = new Set();
      recentExams.forEach(e => (e.questionIds || []).forEach(id => recentQIds.add(id)));

      const stats = computeUserGradeStats(user.id, grade);
      const weakTopicNames = new Set(stats.weakTopicsList.map(w => w.topic));

      const scoredPool = pool.map(q => {
        let priority = 10;
        if (q.difficulty === difficulty) priority += 8;
        if (mode === 'NEW' && !recentQIds.has(q.id)) priority += 6;
        if (mode === 'WEAK_FOCUS' && weakTopicNames.has(q.topic)) priority += 12;
        return { q, priority };
      }).sort((a, b) => b.priority - a.priority);

      let selected = [];
      const mcqCandidates = scoredPool.filter(item => item.q.type === 'mcq').map(item => item.q);
      const essayCandidates = scoredPool.filter(item => item.q.type === 'essay').map(item => item.q);

      if (format === 'mcq') {
        selected = mcqCandidates.slice(0, totalCount);
        if (selected.length < totalCount) selected = selected.concat(essayCandidates.slice(0, totalCount - selected.length));
      } else if (format === 'essay') {
        selected = essayCandidates.slice(0, totalCount);
        if (selected.length < totalCount) selected = selected.concat(mcqCandidates.slice(0, totalCount - selected.length));
      } else {
        const targetEssay = Math.max(1, Math.round(totalCount * 0.3));
        const targetMcq = Math.max(1, totalCount - targetEssay);
        selected = mcqCandidates.slice(0, targetMcq).concat(essayCandidates.slice(0, targetEssay));
      }

      if (selected.length < Math.min(totalCount, 4)) {
        const gradePool = APP_STATE.questions.filter(q => Number(q.grade) === grade && q.verificationStatus === 'verified');
        const usedIds = new Set(selected.map(x => x.id));
        for (const q of gradePool) {
          if (!usedIds.has(q.id)) {
            selected.push(q);
            usedIds.add(q.id);
            if (selected.length >= totalCount) break;
          }
        }
      }

      const questionPoints = {};
      if (selected.length > 0) {
        const basePt = Math.floor((10.0 / selected.length) * 100) / 100;
        let rem = 10.0;
        selected.forEach((q, idx) => {
          const pts = idx === selected.length - 1 ? Number(rem.toFixed(2)) : basePt;
          questionPoints[q.id] = pts;
          rem -= pts;
        });
      }

      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const createdAtStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

      const newExam = {
        id: 'EXAM_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        userId: user.id,
        title: config.customTitle || ('Đề ' + getCategoryLabel(category) + ' - Toán ' + grade + ' (' + getTextbookShortName(textbook) + ')'),
        examCode: config.examCode || String(101 + (APP_STATE.exams.length % 4)),
        grade: grade,
        textbook: textbook,
        semester: semConstraint || 2,
        category: category,
        categoryLabel: getCategoryLabel(category),
        difficulty: difficulty,
        format: format,
        durationMinutes: durationMinutes,
        maxScore: 10.0,
        questionIds: selected.map(q => q.id),
        questionPoints: questionPoints,
        isFavorite: false,
        isSeed: false,
        createdAt: createdAtStr
      };

      APP_STATE.exams.unshift(newExam);
      persistDatabase('generate_exam');
      return newExam;
    }

    function generateSimilarVerifiedQuestion(baseQuestionId) {
      const baseQ = APP_STATE.questions.find(q => q.id === baseQuestionId) || APP_STATE.questions[0];
      let newQ = JSON.parse(JSON.stringify(baseQ));
      const suffix = Math.floor(100 + Math.random() * 899);
      newQ.id = 'Q_SIM_' + Date.now() + '_' + suffix;
      newQ.code = baseQ.code + '-SIM-' + suffix;
      newQ.version = 1;
      newQ.verificationStatus = 'verified';
      newQ.source = 'Sinh tự động & Kiểm chứng từ ' + baseQ.code;
      newQ.type = 'essay';
      newQ.options = [];

      if (baseQ.grade === 8) {
        const a = 4, k = 9;
        const b = a * a + k;
        newQ.content = 'Tìm giá trị nhỏ nhất của đa thức $Q = x^2 - ' + (2 * a) + 'x + ' + b + '$.';
        newQ.correctAnswer = String(k);
        newQ.acceptedAnswers = [String(k), 'min Q = ' + k];
        newQ.solution = 'Ta có $Q = (x - ' + a + ')^2 + ' + k + ' \\geq ' + k + '$ với mọi $x \\in \\mathbb{R}$. Dấu "$=$" xảy ra khi $x = ' + a + '$. Vậy $\\min Q = ' + k + '$.';
      } else if (baseQ.grade === 6) {
        newQ.content = 'Tìm số nguyên $x$, biết: $30 - (x - 5) = -15$.';
        newQ.correctAnswer = '50';
        newQ.acceptedAnswers = ['50', 'x=50', 'x = 50'];
        newQ.solution = 'Ta có $x - 5 = 30 - (-15) = 45 \\Rightarrow x = 50$.';
      } else if (baseQ.grade === 7) {
        newQ.content = 'Tìm hai số $x, y$ biết $\\frac{x}{3} = \\frac{y}{5}$ và $x + y = 40$. (Nhập dạng `x=15; y=25`)';
        newQ.correctAnswer = 'x=15; y=25';
        newQ.acceptedAnswers = ['x=15; y=25', '15; 25', '(15; 25)'];
        newQ.solution = 'Áp dụng tính chất dãy tỉ số bằng nhau: $\\frac{x}{3} = \\frac{y}{5} = \\frac{40}{8} = 5 \\Rightarrow x = 15; y = 25$.';
      } else {
        newQ.content = 'Giải phương trình bậc hai: $x^2 - 7x + 10 = 0$. (Nhập các nghiệm cách nhau bởi dấu chấm phẩy)';
        newQ.correctAnswer = '2; 5';
        newQ.acceptedAnswers = ['2; 5', '5; 2', 'x=2; x=5'];
        newQ.solution = 'Ta có $\\Delta = (-7)^2 - 4(1)(10) = 9 > 0$. Hai nghiệm phân biệt là $x_1 = 2; x_2 = 5$.';
      }

      APP_STATE.questions.unshift(newQ);
      persistDatabase('clone_question');
      return newQ;
    }

      el.style.cssText = 'background:' + (bgMap[type] || bgMap.info) + ';color:#FFFFFF;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 16px rgba(15,23,42,0.2);display:flex;align-items:center;justify-content:space-between;gap:12px;';
      el.innerHTML = '<span>' + message + '</span><button type="button" style="background:transparent;border:none;color:#fff;cursor:pointer;font-weight:800;" onclick="this.parentElement.remove()">✕</button>';

      setTimeout(() => { if (el && el.parentElement) el.remove(); }, 4000);

    function syncSemesterWithCategory() {
      const catEl = document.getElementById('gen-category');
      const semEl = document.getElementById('gen-semester');
      const gradeEl = document.getElementById('gen-grade');
      if (!catEl || !semEl) return;
      const val = catEl.value;
      if (val === 'GIUA_KI_1' || val === 'CUOI_KI_1') semEl.value = '1';
      else if (val === 'GIUA_KI_2' || val === 'CUOI_KI_2') semEl.value = '2';
      else if (val === 'THI_VAO_10') { semEl.value = '0'; if (gradeEl) gradeEl.value = '9'; }
      updateGeneratorChaptersUI();
    }

    function updateGeneratorChaptersUI() {
      const gradeEl = document.getElementById('gen-grade');
      const semEl = document.getElementById('gen-semester');
      const chEl = document.getElementById('gen-chapter');
      if (!gradeEl || !chEl) return;
      const gMeta = getGradeMeta(Number(gradeEl.value));
      const sem = semEl ? Number(semEl.value) : 0;
      const chapters = sem === 1 || sem === 2 ? gMeta.chapters.filter(c => Number(c.semester) === sem) : gMeta.chapters;
      chEl.innerHTML = '<option value="ALL">Toàn bộ các chương trong phạm vi</option>' + chapters.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
      updateGeneratorMatrixPreview();
    }

    function updateGeneratorMatrixPreview() {
      const box = document.getElementById('generator-matrix-preview-box');
      if (!box) return;
      const grade = Number((document.getElementById('gen-grade') || {}).value || 8);
      const book = (document.getElementById('gen-book') || {}).value || 'KNTT';
      const cat = (document.getElementById('gen-category') || {}).value || 'GIUA_KI_1';
      const fmt = (document.getElementById('gen-format') || {}).value || 'combined';
      const count = Number((document.getElementById('gen-count') || {}).value || 5);

      let mcqCount = fmt === 'mcq' ? count : (fmt === 'essay' ? 0 : Math.max(1, count - Math.max(1, Math.round(count * 0.3))));
      let essayCount = count - mcqCount;

      box.innerHTML = `
        <div class="mm-table-wrap">
          <table class="mm-table">
            <thead><tr><th>Thành phần</th><th>Số câu</th><th>Mức độ nhận thức</th></tr></thead>
            <tbody>
              <tr><td style="font-weight:600;">Phần I. Trắc nghiệm 4 lựa chọn</td><td>${mcqCount} câu</td><td>Nhận biết & Thông hiểu</td></tr>
              <tr><td style="font-weight:600;">Phần II. Tự luận trình bày giải</td><td>${essayCount} câu</td><td>Vận dụng & Vận dụng cao</td></tr>
              <tr style="background:var(--bg-muted);font-weight:700;">
                <td>Tổng Ma trận (${getCategoryLabel(cat)})</td>
                <td>${count} câu (10.0đ)</td>
                <td>Lớp ${grade} • ${getTextbookShortName(book)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function handleCreateExamAndStart(startNow) {
      const config = {
        grade: Number((document.getElementById('gen-grade') || {}).value || 8),
        textbook: (document.getElementById('gen-book') || {}).value || 'KNTT',
        category: (document.getElementById('gen-category') || {}).value || 'GIUA_KI_1',
        semester: Number((document.getElementById('gen-semester') || {}).value || 1),
        chapterId: (document.getElementById('gen-chapter') || {}).value || 'ALL',
        difficulty: (document.getElementById('gen-difficulty') || {}).value || 'medium',
        format: (document.getElementById('gen-format') || {}).value || 'combined',
        questionCount: Number((document.getElementById('gen-count') || {}).value || 5),
        durationMinutes: Number((document.getElementById('gen-duration') || {}).value || 45),
        generationMode: (document.getElementById('gen-mode') || {}).value || 'NEW',
        sourceMode: (document.getElementById('gen-source') || {}).value || 'COMBINED_DOCS',
        customTitle: ((document.getElementById('gen-custom-title') || {}).value || '').trim()

      const exam = generateControlledExam(config);
      showToast('Đã tạo đề thi: ' + exam.title, 'success');

    function toggleFavoriteExam(examId) {
      const ex = APP_STATE.exams.find(e => e.id === examId);
      if (!ex) return;
      ex.isFavorite = !ex.isFavorite;
      persistDatabase('fav_exam');
      renderCurrentView();
      showToast(ex.isFavorite ? 'Đã lưu đề vào Yêu thích' : 'Đã bỏ lưu Yêu thích', 'info');
    }

    function cloneMultiCodeExam(examId) {
      const ex = APP_STATE.exams.find(e => e.id === examId);
      if (!ex) return;
      const newCode = String(Number(ex.examCode || 101) + 1);
      const copy = JSON.parse(JSON.stringify(ex));
      copy.id = 'EXAM_COPY_' + Date.now();
      copy.examCode = newCode;
      copy.title = ex.title.replace(/\s*\(Mã #\d+\)/, '') + ' (Mã #' + newCode + ')';
      copy.questionIds = [...ex.questionIds].reverse();
      copy.userId = getCurrentUser().id;
      copy.isSeed = false;
      APP_STATE.exams.unshift(copy);
      persistDatabase('clone_exam');
      renderCurrentView();
      showToast('Đã tạo Mã đề #' + newCode + ' từ cùng ma trận!', 'success');
    }

    function verifyQuestionItem(qId) {
      const q = APP_STATE.questions.find(item => item.id === qId);
      if (!q) return;
      q.verificationStatus = 'verified';
      persistDatabase('verify_q');
      renderCurrentView();
      showToast('Đã xác minh câu hỏi ' + q.code, 'success');
    }

    function deleteQuestionItem(qId) {
      APP_STATE.questions = APP_STATE.questions.filter(q => q.id !== qId);
      persistDatabase('delete_q');
      renderCurrentView();
      showToast('Đã xóa câu hỏi', 'info');
    }

    // EXAM ROOM & RESULT VIEW
    function startExamAttempt(examId) {
      const exam = APP_STATE.exams.find(e => e.id === examId);
      if (!exam) return;
      const user = getCurrentUser();
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const nowStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

      const newAttempt = {
        id: 'ATT_' + Date.now(),
        examId: exam.id,
        userId: user.id,
        grade: exam.grade,
        status: 'IN_PROGRESS',
        startedAt: nowStr,
        submittedAt: null,
        timeSpentSeconds: 0,
        remainingSeconds: (exam.durationMinutes || 45) * 60,
        totalScore: null,
        mcqScore: null,
        essayScore: null,
        correctCount: 0,
        wrongCount: 0,
        unansweredCount: exam.questionIds.length,
        answers: {}
      };

      APP_STATE.attempts.unshift(newAttempt);
      APP_STATE.activeAttemptId = newAttempt.id;
      APP_STATE.activeExamQuestionIndex = 0;
      persistDatabase('start_attempt');
      startExamCountdownTimer();
      navigateTo('exam-room');
    }

    function resumeExamAttempt(attemptId) {
      const att = APP_STATE.attempts.find(a => a.id === attemptId);
      if (!att) return;
      APP_STATE.activeAttemptId = att.id;
      APP_STATE.activeExamQuestionIndex = 0;
      startExamCountdownTimer();
      navigateTo('exam-room');
      showToast('Đã khôi phục bài thi đang làm dở!', 'info');
    }

    function startExamCountdownTimer() {
      if (APP_STATE.examTimerInterval) clearInterval(APP_STATE.examTimerInterval);
      APP_STATE.examTimerInterval = setInterval(() => {
        if (APP_STATE.currentView !== 'exam-room' || !APP_STATE.activeAttemptId) {
          clearInterval(APP_STATE.examTimerInterval);
          return;
        }
        const att = APP_STATE.attempts.find(a => a.id === APP_STATE.activeAttemptId);
        if (!att || att.status !== 'IN_PROGRESS') {
          clearInterval(APP_STATE.examTimerInterval);
          return;
        }
        att.timeSpentSeconds = (att.timeSpentSeconds || 0) + 1;
        att.remainingSeconds = Math.max(0, (att.remainingSeconds || 0) - 1);
        const timerEl = document.getElementById('exam-room-timer-display');
        if (timerEl) {
          const mins = Math.floor(att.remainingSeconds / 60);
          const secs = att.remainingSeconds % 60;
          timerEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
          if (att.remainingSeconds <= 300) timerEl.style.color = 'var(--rose)';
        }
        if (att.timeSpentSeconds % 10 === 0) persistDatabase('timer_autosave');
        if (att.remainingSeconds <= 0) {
          clearInterval(APP_STATE.examTimerInterval);
          finalizeExamSubmission(att.id);
        }
      }, 1000);
    }

    function renderExamRoomView(container) {
      const att = APP_STATE.attempts.find(a => a.id === APP_STATE.activeAttemptId);
      if (!att) { navigateTo('dashboard'); return; }
      const exam = APP_STATE.exams.find(e => e.id === att.examId);
      if (!exam) { navigateTo('dashboard'); return; }

      const questions = exam.questionIds.map(id => APP_STATE.questions.find(q => q.id === id)).filter(Boolean);
      const idx = Math.max(0, Math.min(questions.length - 1, APP_STATE.activeExamQuestionIndex || 0));
      const currentQ = questions[idx];
      const qPts = (exam.questionPoints && exam.questionPoints[currentQ.id]) ? exam.questionPoints[currentQ.id] : currentQ.points;
      const ansRecord = (att.answers && att.answers[currentQ.id]) ? att.answers[currentQ.id] : { value: '', flagged: false };

      const answeredCount = questions.filter(q => att.answers && att.answers[q.id] && String(att.answers[q.id].value || '').trim() !== '').length;
      const progressPct = Math.round((answeredCount / questions.length) * 100);
      const mins = Math.floor((att.remainingSeconds || 0) / 60);
      const secs = (att.remainingSeconds || 0) % 60;

      const paletteButtonsHTML = questions.map((q, i) => {
        const rec = att.answers && att.answers[q.id];
        const hasVal = rec && String(rec.value || '').trim() !== '';
        const isFlagged = rec && rec.flagged;
        const isCurrent = i === idx;
        let bg = isFlagged ? 'var(--amber-soft)' : (hasVal ? 'var(--primary)' : 'var(--bg-muted)');
        let color = isFlagged ? 'var(--amber)' : (hasVal ? '#FFFFFF' : 'var(--text-main)');
        let border = isCurrent ? '2px solid var(--primary)' : '1px solid var(--border-color)';
        return `<button type="button" style="height:36px;border-radius:8px;font-weight:700;font-size:13px;background:${bg};color:${color};border:${border};cursor:pointer;" onclick="jumpToExamQuestion(${i})">${i + 1}${isFlagged ? '🚩' : ''}</button>`;
      }).join('');

      let answerInputHTML = '';
      if (currentQ.type === 'mcq') {
        answerInputHTML = `
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
            ${(currentQ.options || []).map(opt => {
              const selected = ansRecord.value === opt.label;
              return `
                <button type="button" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:${selected ? '2px solid var(--primary)' : '1px solid var(--border-color)'};background:${selected ? 'var(--primary-soft)' : 'var(--bg-surface)'};text-align:left;cursor:pointer;width:100%;" onclick="saveStudentAnswer('${currentQ.id}', '${opt.label}')">
                  <span style="width:28px;height:28px;border-radius:50%;background:${selected ? 'var(--primary)' : 'var(--bg-muted)'};color:${selected ? '#FFFFFF' : 'var(--text-main)'};display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;">${opt.label}</span>
                  <span style="font-size:14px;color:var(--text-main);font-weight:${selected ? '700' : '500'};">${formatMathText(opt.text)}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else {
        const mathSymbols = [
          { label: 'Phân số a/b', insert: '\\frac{a}{b}' },
          { label: '√x', insert: '\\sqrt{}' },
          { label: 'x²', insert: '^2' },
          { label: '≤', insert: '\\leq ' },
          { label: '≥', insert: '\\geq ' },
          { label: '≠', insert: '\\neq ' },
          { label: 'x=..; y=..', insert: 'x=; y=' }
        ];
        answerInputHTML = `
          <div style="margin-top:14px;">
            <label class="mm-label">Chèn nhanh ký hiệu Toán học (Tự luận):</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
              ${mathSymbols.map(s => `<button type="button" class="mm-btn mm-btn-outline mm-btn-sm" onclick="insertMathSymbolToEssay('${currentQ.id}', '${s.insert.replace(/\\/g, '\\\\')}')">${s.label}</button>`).join('')}
            </div>
            <label class="mm-label" for="essay-ans-input">Nhập đáp số cuối cùng (chấp nhận phân số <code>2/5</code>, thập phân <code>0,4</code>, căn thức <code>3\\sqrt{2}</code>, tập nghiệm <code>2; 3</code>):</label>
            <input type="text" id="essay-ans-input" class="mm-input" style="font-size:15px;font-weight:600;margin-bottom:8px;" placeholder="Nhập kết quả toán học..." value="${(ansRecord.value || '').replace(/"/g, '&quot;')}" oninput="saveStudentAnswer('${currentQ.id}', this.value)">
            <label class="mm-label" for="essay-workings-input">Trình bày các bước giải (tùy chọn):</label>
            <textarea id="essay-workings-input" class="mm-textarea" rows="3" placeholder="Bước 1: ĐKXĐ... Bước 2: Biến đổi..." oninput="saveStudentEssayWorkings('${currentQ.id}', this.value)">${ansRecord.workings || ''}</textarea>
            <div style="margin-top:8px;padding:8px 12px;background:var(--bg-muted);border-radius:8px;font-size:13px;">
              <span style="color:var(--text-secondary);font-weight:600;">Xem trước biểu thức: </span>
              <span id="essay-live-math-preview" style="font-weight:700;color:var(--primary);">${ansRecord.value ? formatMathText('$' + ansRecord.value + '$') : '—'}</span>
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="mm-card-static" style="margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
          <div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
              <span class="mm-badge badge-blue">Đang làm bài • Mã đề #${exam.examCode}</span>
              <span class="mm-badge badge-emerald">✓ Tự động lưu (${APP_STATE.lastSavedTime})</span>
            </div>
            <h2 style="font-size:16.5px;font-weight:800;color:var(--text-main);">${exam.title}</h2>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <div style="padding:6px 12px;background:var(--bg-muted);border-radius:10px;display:flex;align-items:center;gap:6px;">
              <span>⏱️</span>
              <span id="exam-room-timer-display" style="font-size:17px;font-weight:800;color:var(--primary);">${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}</span>
            </div>
            <button type="button" class="mm-btn mm-btn-outline mm-btn-sm" onclick="pauseAndSaveExam()">⏸ Lưu & Tạm dừng</button>
            <button type="button" class="mm-btn mm-btn-primary mm-btn-sm" onclick="confirmSubmitExam('${att.id}')">✓ Nộp bài & Chấm điểm</button>
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <div class="mm-progress-track"><div class="mm-progress-fill" style="width:${progressPct}%;background:var(--primary);"></div></div>
        </div>

        <div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start;" class="exam-room-grid">
          <div class="mm-card-static">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--border-color);margin-bottom:12px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="mm-badge badge-blue">Câu ${idx + 1} / ${questions.length}</span>
                <span class="mm-badge ${currentQ.type === 'mcq' ? 'badge-purple' : 'badge-amber'}">${currentQ.type === 'mcq' ? 'Trắc nghiệm' : 'Tự luận'}</span>
                <span class="mm-badge badge-gray">${qPts} điểm</span>
              </div>
              <button type="button" class="mm-btn ${ansRecord.flagged ? 'mm-btn-amber' : 'mm-btn-outline'} mm-btn-sm" onclick="toggleFlagQuestion('${currentQ.id}')">
                🚩 ${ansRecord.flagged ? 'Đã đánh dấu' : 'Đánh dấu xem lại'}
              </button>
            </div>

            <div style="font-size:15.5px;font-weight:600;color:var(--text-main);line-height:1.55;">
              ${formatMathText(currentQ.content)}
            </div>

            ${answerInputHTML}

            <div style="margin-top:20px;padding-top:12px;border-top:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;">
              <button type="button" class="mm-btn mm-btn-outline mm-btn-sm" ${idx === 0 ? 'disabled style="opacity:0.5;"' : ''} onclick="jumpToExamQuestion(${idx - 1})">← Câu trước</button>
              <button type="button" class="mm-btn mm-btn-outline mm-btn-sm" onclick="openStepHintForQuestion('${currentQ.id}')">🦉 Gợi ý tư duy</button>
              ${idx < questions.length - 1 ? `<button type="button" class="mm-btn mm-btn-primary mm-btn-sm" onclick="jumpToExamQuestion(${idx + 1})">Câu tiếp theo →</button>` : `<button type="button" class="mm-btn mm-btn-emerald mm-btn-sm" onclick="confirmSubmitExam('${att.id}')">Nộp bài ✓</button>`}
            </div>
          </div>

          <div class="mm-card-static">
            <h4 style="font-size:14px;font-weight:700;margin-bottom:10px;">Danh sách câu hỏi (${answeredCount}/${questions.length})</h4>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">${paletteButtonsHTML}</div>
          </div>
        </div>
      `;
    }

    function jumpToExamQuestion(newIndex) {
      APP_STATE.activeExamQuestionIndex = newIndex;
      renderCurrentView();
    }

    function saveStudentAnswer(questionId, val) {
      const att = APP_STATE.attempts.find(a => a.id === APP_STATE.activeAttemptId);
      if (!att) return;
      if (!att.answers) att.answers = {};
      if (!att.answers[questionId]) att.answers[questionId] = { value: '', workings: '', flagged: false };
      att.answers[questionId].value = val;
      persistDatabase('save_ans');
      const previewEl = document.getElementById('essay-live-math-preview');
      if (previewEl) {
        previewEl.innerHTML = val ? formatMathText('$' + val + '$') : '—';
        return;
      }
      renderCurrentView();
    }

    function saveStudentEssayWorkings(questionId, text) {
      const att = APP_STATE.attempts.find(a => a.id === APP_STATE.activeAttemptId);
      if (!att) return;
      if (!att.answers) att.answers = {};
      if (!att.answers[questionId]) att.answers[questionId] = { value: '', workings: '', flagged: false };
      att.answers[questionId].workings = text;
      persistDatabase('save_workings');
    }

    function insertMathSymbolToEssay(questionId, sym) {
      const inp = document.getElementById('essay-ans-input');
      if (!inp) return;
      inp.value = (inp.value || '') + sym;
      saveStudentAnswer(questionId, inp.value);
      inp.focus();
    }

    function toggleFlagQuestion(questionId) {
      const att = APP_STATE.attempts.find(a => a.id === APP_STATE.activeAttemptId);
      if (!att) return;
      if (!att.answers) att.answers = {};
      if (!att.answers[questionId]) att.answers[questionId] = { value: '', workings: '', flagged: false };
      att.answers[questionId].flagged = !att.answers[questionId].flagged;
      persistDatabase('flag_q');
      renderCurrentView();
    }

    function pauseAndSaveExam() {
      if (APP_STATE.examTimerInterval) clearInterval(APP_STATE.examTimerInterval);
      persistDatabase('pause_exam');
      showToast('Đã lưu bài thi. Bạn có thể tiếp tục làm bất cứ lúc nào!', 'info');
      navigateTo('dashboard');
    }

    function confirmSubmitExam(attemptId) {
      const att = APP_STATE.attempts.find(a => a.id === attemptId);
      if (!att) return;
      const exam = APP_STATE.exams.find(e => e.id === att.examId);
      const totalQ = exam ? exam.questionIds.length : 0;
      const answeredCount = exam ? exam.questionIds.filter(qid => att.answers && att.answers[qid] && String(att.answers[qid].value || '').trim() !== '').length : 0;

      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;
      box.innerHTML = `
        <h3 style="font-size:18px;font-weight:800;margin-bottom:8px;">Xác nhận Nộp bài & Chấm điểm</h3>
        <p style="font-size:14px;color:var(--text-secondary);margin-bottom:14px;">Bạn đã hoàn thành <strong>${answeredCount}/${totalQ}</strong> câu hỏi.</p>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="mm-btn mm-btn-outline" onclick="closeCustomModal()">Quay lại kiểm tra</button>
          <button type="button" class="mm-btn mm-btn-primary" onclick="closeCustomModal();finalizeExamSubmission('${attemptId}')">Nộp bài ngay ✓</button>
        </div>
      `;
      modal.classList.add('open');
    }

    function finalizeExamSubmission(attemptId) {
      if (APP_STATE.examTimerInterval) clearInterval(APP_STATE.examTimerInterval);
      const att = APP_STATE.attempts.find(a => a.id === attemptId);
      if (!att) return;
      const exam = APP_STATE.exams.find(e => e.id === att.examId);
      if (!exam) return;

      let mcqScore = 0, essayScore = 0, correctCount = 0, wrongCount = 0, unansweredCount = 0;
      if (!att.answers) att.answers = {};

      exam.questionIds.forEach(qid => {
        const q = APP_STATE.questions.find(item => item.id === qid);
        if (!q) return;
        const maxPts = (exam.questionPoints && exam.questionPoints[qid]) ? Number(exam.questionPoints[qid]) : Number(q.points || 1.0);
        const rec = att.answers[qid] || { value: '', workings: '', flagged: false };
        const rawVal = String(rec.value || '').trim();

        if (!rawVal && !String(rec.workings || '').trim()) {
          unansweredCount += 1; rec.isCorrect = false; rec.points = 0; rec.matchedReason = 'Chưa trả lời';
        } else if (q.type === 'mcq') {
          const isRight = rawVal.toUpperCase() === String(q.correctAnswer).toUpperCase();
          rec.isCorrect = isRight;
          rec.points = isRight ? maxPts : 0;
          if (isRight) { mcqScore += maxPts; correctCount += 1; }
          else { wrongCount += 1; addQuestionToReviewQueue(att.userId, q.id, rawVal, 'CALCULATION_ERROR'); }
        } else {
          const eqCheck = checkMathEquivalence(rawVal, q);
          if (eqCheck.isCorrect) {
            rec.isCorrect = true; rec.points = maxPts; rec.matchedReason = eqCheck.matchedReason; rec.isAiEstimated = false;
            essayScore += maxPts; correctCount += 1;
          } else if (rec.workings && rec.workings.trim().length > 10) {
            const partial = Number((maxPts * 0.5).toFixed(2));
            rec.isCorrect = false; rec.points = partial; rec.isAiEstimated = true;
            rec.errorCategory = eqCheck.errorCategory || 'CALCULATION_ERROR';
            rec.matchedReason = 'Điểm thành phần ước lượng từ bước giải (cần xác nhận)';
            essayScore += partial; wrongCount += 1;
            addQuestionToReviewQueue(att.userId, q.id, rawVal || rec.workings, rec.errorCategory);
          } else {
            rec.isCorrect = false; rec.points = 0; rec.errorCategory = eqCheck.errorCategory || 'CALCULATION_ERROR';
            rec.matchedReason = eqCheck.matchedReason; wrongCount += 1;
            addQuestionToReviewQueue(att.userId, q.id, rawVal, rec.errorCategory);
          }
        }
        att.answers[qid] = rec;
      });

      const totalScore = Math.min(10.0, Number((mcqScore + essayScore).toFixed(2)));
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      att.submittedAt = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      att.status = 'GRADED';
      att.mcqScore = Number(mcqScore.toFixed(2));
      att.essayScore = Number(essayScore.toFixed(2));
      att.totalScore = totalScore;
      att.correctCount = correctCount;
      att.wrongCount = wrongCount;
      att.unansweredCount = unansweredCount;

      const user = getCurrentUser();
      const earnedXp = Math.round(40 + totalScore * 12);
      user.xp = (user.xp || 0) + earnedXp;
      user.level = Math.max(1, Math.floor(user.xp / 200) + 1);

      APP_STATE.studySessions.unshift({
        id: 'SES_' + Date.now(), userId: user.id, grade: exam.grade,
        activity: 'Hoàn thành ' + exam.title, minutes: Math.max(1, Math.ceil((att.timeSpentSeconds || 60) / 60)),
        xp: earnedXp, date: att.submittedAt.split(' ')[0]
      });

      unlockAchievementIfEligible(user.id, 'ACH_FIRST_EXAM');
      if (totalScore >= 9.0) unlockAchievementIfEligible(user.id, 'ACH_HIGH_SCORE');
      if (totalScore >= 10.0) unlockAchievementIfEligible(user.id, 'ACH_PERFECT_10');

      APP_STATE.viewingResultAttemptId = att.id;
      persistDatabase('submit_exam');
      updateHeaderUI();
      showToast('🎉 Đã chấm bài! Bạn đạt ' + totalScore.toFixed(2) + '/10 điểm (+' + earnedXp + ' XP)', 'success');
      navigateTo('exam-result');
    }

    function addQuestionToReviewQueue(userId, questionId, wrongVal, errType) {
      const existing = APP_STATE.reviewQueue.find(r => r.userId === userId && r.questionId === questionId);
      if (existing) {
        existing.wrongAttempts = (existing.wrongAttempts || 1) + 1;
        existing.lastWrongAnswer = wrongVal;
        existing.errorType = errType;
        existing.resolved = false;
      } else {
        APP_STATE.reviewQueue.unshift({
          id: 'REV_' + Date.now() + '_' + Math.floor(Math.random() * 100),
          userId: userId, questionId: questionId, wrongAttempts: 1,
          lastWrongAnswer: wrongVal, errorType: errType || 'CALCULATION_ERROR', resolved: false, addedAt: 'Hôm nay'
        });
      }
    }

    function unlockAchievementIfEligible(userId, achId) {
      if (!APP_STATE.userAchievements.some(ua => ua.userId === userId && ua.achievementId === achId)) {
        APP_STATE.userAchievements.push({ userId: userId, achievementId: achId, unlockedAt: 'Hôm nay' });
      }
    }

    function openExamResult(attemptId) {
      APP_STATE.viewingResultAttemptId = attemptId;
      navigateTo('exam-result');
    }

    function renderExamResultView(container) {
      const att = APP_STATE.attempts.find(a => a.id === APP_STATE.viewingResultAttemptId) || APP_STATE.attempts.find(a => a.status === 'GRADED');
      if (!att) { navigateTo('history'); return; }
      const exam = APP_STATE.exams.find(e => e.id === att.examId);
      const questions = exam ? exam.questionIds.map(id => APP_STATE.questions.find(q => q.id === id)).filter(Boolean) : [];
      const minsSpent = Math.floor((att.timeSpentSeconds || 0) / 60);
      const secsSpent = (att.timeSpentSeconds || 0) % 60;

      const detailCardsHTML = questions.map((q, i) => {
        const rec = (att.answers && att.answers[q.id]) ? att.answers[q.id] : { value: '', isCorrect: false, points: 0 };
        const maxPts = (exam.questionPoints && exam.questionPoints[q.id]) ? exam.questionPoints[q.id] : q.points;
        const statusBadge = rec.isCorrect
          ? `<span class="mm-badge badge-emerald">✓ Chính xác (+${rec.points}/${maxPts}đ)</span>`
          : (rec.points > 0 ? `<span class="mm-badge badge-amber">⚠️ Điểm từng phần (+${rec.points}/${maxPts}đ)</span>` : `<span class="mm-badge badge-rose">✕ Sai / Chưa đạt (0/${maxPts}đ)</span>`);

        return `
          <div class="mm-card-static" style="margin-bottom:14px;border-left:4px solid ${rec.isCorrect ? 'var(--emerald)' : 'var(--rose)'};">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="mm-badge badge-blue">Câu ${i + 1} (${q.code})</span>
                <span class="mm-badge badge-purple">${q.topic}</span>
                ${statusBadge}
              </div>

    function adjustEssayQuestionScore(attemptId, questionId, newPts) {
      const att = APP_STATE.attempts.find(a => a.id === attemptId);
      if (!att || !att.answers || !att.answers[questionId]) return;
      const exam = APP_STATE.exams.find(e => e.id === att.examId);
      const maxPts = (exam && exam.questionPoints && exam.questionPoints[questionId]) ? Number(exam.questionPoints[questionId]) : 2.0;
      att.answers[questionId].points = Number(newPts);
      att.answers[questionId].isCorrect = Number(newPts) >= maxPts;
      att.answers[questionId].isAiEstimated = false;

      let mcq = 0, essay = 0, right = 0, wrong = 0;
      (exam ? exam.questionIds : Object.keys(att.answers)).forEach(qid => {
        const q = APP_STATE.questions.find(item => item.id === qid);
        const r = att.answers[qid];
        if (!q || !r) return;
        if (q.type === 'mcq') mcq += Number(r.points || 0);
        else essay += Number(r.points || 0);
        if (r.isCorrect) right += 1; else wrong += 1;
      });
      att.mcqScore = Number(mcq.toFixed(2));
      att.essayScore = Number(essay.toFixed(2));
      att.totalScore = Math.min(10.0, Number((mcq + essay).toFixed(2)));
      att.correctCount = right;
      att.wrongCount = wrong;
      persistDatabase('confirm_essay');
      renderCurrentView();
      showToast('Đã cập nhật điểm tổng: ' + att.totalScore.toFixed(2) + '/10', 'success');
    }

    async function handleRealFileSelected(inputEl) {
      if (!inputEl || !inputEl.files || inputEl.files.length === 0) return;
      const file = inputEl.files[0];
      const ext = (file.name.split('.').pop() || '').toUpperCase();
      if (file.size > 15 * 1024 * 1024) {
        showToast('File vượt quá giới hạn 15MB!', 'error');
        return;
      }
      const user = getCurrentUser();
      const detectedGrade = file.name.includes('6') ? 6 : (file.name.includes('7') ? 7 : (file.name.includes('9') ? 9 : Number(user.currentGrade || 8)));
      const gMeta = getGradeMeta(detectedGrade);

      if (APP_STATE.backendConnected) {
        try {
          const formData = new FormData();
          formData.append('file', file);
          formData.append('userId', user.id);
          formData.append('grade', String(detectedGrade));
          formData.append('textbook', user.preferredBook);
          const resp = await fetch('/api/documents', { method: 'POST', body: formData });
          const data = await resp.json();
          if (data && data.requiresApiKey) {
            preparePendingExtraction(file.name, ext, file.size, detectedGrade, user.preferredBook, 1, gMeta.chapters[0].id, '', data.message);
            showToast(data.message, 'warning');
            return;
          }
          if (data && data.extractedText !== undefined) {
            preparePendingExtraction(file.name, ext, file.size, detectedGrade, user.preferredBook, 1, gMeta.chapters[0].id, data.extractedText, data.notice || null);
            showToast('Đã tải file lên máy chủ và bóc tách văn bản!', 'success');
            return;
          }
        } catch (err) {}
      }

      if (['TXT', 'MD', 'CSV', 'JSON'].includes(ext)) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          preparePendingExtraction(file.name, ext, file.size, detectedGrade, user.preferredBook, 1, gMeta.chapters[0].id, String(ev.target.result || ''), null);
          showToast('Đã đọc trực tiếp nội dung file ' + ext + ' (không cần AI API)!', 'success');
        };
        reader.readAsText(file, 'UTF-8');
      } else {
        const ocrNotice = '⚠️ Chưa cấu hình API Key OCR/AI (GEMINI_API_KEY hoặc MATHPIX_APP_KEY trong file .env). Hệ thống KHÔNG giả lập trích xuất câu hỏi từ file nhị phân/ảnh (' + ext + '). Vui lòng cấu hình API Key ở backend, hoặc tải lên file văn bản (.TXT, .MD, .CSV), hoặc tự dán nội dung câu hỏi vào ô bên dưới rồi nhấn "Phân tích lại".';
        preparePendingExtraction(file.name, ext, file.size, detectedGrade, user.preferredBook, 1, gMeta.chapters[0].id, '', ocrNotice);
        showToast('Chức năng OCR file ' + ext + ' yêu cầu GEMINI_API_KEY hoặc MATHPIX_APP_KEY (không giả lập kết quả).', 'warning');
      }
    }

    function parseQuestionsFromRawText(rawText) {
      const cleaned = String(rawText || '').trim();
      if (!cleaned) return [];
      const blocks = cleaned.split(/(?=Câu\s*\d+\s*:)/i).map(b => b.trim()).filter(b => /^Câu\s*\d+/i.test(b));
      if (blocks.length === 0) return [{ content: cleaned.slice(0, 200), type: 'essay', correctAnswer: '1', solution: 'Giải theo tài liệu.' }];
      return blocks.map(blk => {
        const lines = blk.split('\n').map(l => l.trim()).filter(Boolean);
        const qLine = (lines[0] || '').replace(/^Câu\s*\d+\s*:\s*/i, '');
        let ans = '1', sol = 'Áp dụng kiến thức trong tài liệu.';
        lines.forEach(l => {
          if (/^Đáp án\s*:/i.test(l)) ans = l.replace(/^Đáp án\s*:\s*/i, '').replace(/\.$/, '').trim();
          if (/^Lời giải\s*:/i.test(l)) sol = l.replace(/^Lời giải\s*:\s*/i, '').trim();
        });
        return { content: qLine, type: 'essay', correctAnswer: ans, solution: sol };
      });
    }

    function preparePendingExtraction(fileName, fileType, fileSize, grade, textbook, semester, chapterId, extractedText, ocrNotice) {
      PENDING_DOC_EXTRACTION = {
        fileName, fileType, fileSize, grade: Number(grade), textbook, semester: Number(semester),
        chapterId, extractedText, ocrNotice, candidateQuestions: parseQuestionsFromRawText(extractedText)
      };
      renderCurrentView();
    }

      if (!PENDING_DOC_EXTRACTION) return;

    async function confirmDeleteUserAccount(targetUserId) {
      const target = APP_STATE.users.find(u => u.id === targetUserId);
      if (!target) return;
      const deletedName = target.fullName;

      // Xóa tài khoản và toàn bộ dữ liệu phụ thuộc (Cascade Delete)
      APP_STATE.users = APP_STATE.users.filter(u => u.id !== targetUserId);
      APP_STATE.exams = APP_STATE.exams.filter(e => e.userId !== targetUserId || e.isSeed);
      APP_STATE.attempts = APP_STATE.attempts.filter(a => a.userId !== targetUserId);
      APP_STATE.documents = APP_STATE.documents.filter(d => d.userId !== targetUserId);
      APP_STATE.reviewQueue = APP_STATE.reviewQueue.filter(r => r.userId !== targetUserId);
      APP_STATE.userAchievements = APP_STATE.userAchievements.filter(ua => ua.userId !== targetUserId);
      APP_STATE.learningGoals = APP_STATE.learningGoals.filter(g => g.userId !== targetUserId);
      APP_STATE.studySessions = APP_STATE.studySessions.filter(s => s.userId !== targetUserId);

      // Nếu xóa hết toàn bộ tài khoản, tự động tạo 1 tài khoản mặc định mới để web luôn hoạt động
      if (APP_STATE.users.length === 0) {
        const fallbackUser = {
          id: 'user_' + Date.now(),
          username: 'hocsinh_moi',
          email: 'hocsinh@mathmaster.edu.vn',
          passwordHash: 'pass123',
          fullName: 'Học sinh Mới',
          role: 'STUDENT',
          isGuest: false,
          schoolName: 'THCS Việt Nam',
          currentGrade: 8,
          preferredBook: 'KNTT',
          xp: 0,
          level: 1,
          streakDays: 1,
          lastStudyDate: '2026-10-18',
          theme: 'light'
        };
        APP_STATE.users.push(fallbackUser);
      }

      // Nếu tài khoản bị xóa đang là tài khoản hiện hành thì tự động chuyển sang tài khoản đầu tiên còn lại
      if (APP_STATE.currentUserId === targetUserId) {
        APP_STATE.currentUserId = APP_STATE.users[0].id;
        APP_STATE.selectedGradeView = APP_STATE.users[0].currentGrade || 8;
      }

      if (APP_STATE.backendConnected) {
        try {
          await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'delete', userId: targetUserId })
          });
        } catch (e) {}
      }

      persistDatabase('delete_user');
      closeCustomModal();
      updateHeaderUI();
      renderCurrentView();
      showToast('Đã xóa vĩnh viễn tài khoản: ' + deletedName, 'info');
    }

      showToast('Đã xuất file backup JSON!', 'success');
