    async function requestAiCustomExplanation(qId) {
      const box = document.getElementById('assistant-ai-notice-box');
      if (!box) return;
      box.style.display = 'block';
      if (APP_STATE.backendConnected) {
        try {
          const res = await fetch('/api/ai/assistant', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ questionId: qId })
          });
          const data = await res.json();
          box.innerHTML = data.message || 'Chưa cấu hình GEMINI_API_KEY.';
          return;
        } catch (e) {}
      }
      if (!APP_STATE.aiConfigured) {
        box.innerHTML = '⚠️ <strong>Thông báo rõ ràng (Không giả lập AI):</strong> Chức năng hỏi đáp tự do bằng AI yêu cầu cấu hình <code>GEMINI_API_KEY</code> trong file <code>.env</code> của Backend. Hiện tại chưa có API Key nên hệ thống không tự bịa câu trả lời AI. Bạn vẫn có thể xem đầy đủ 3 bước gợi ý và lời giải chuẩn từ ngân hàng câu hỏi ở trên!';
      }
    }

    function openStepHintForQuestion(qId) { openAssistantModal(qId); }
    function closeAssistantModal() { const m = document.getElementById('assistant-modal'); if (m) m.classList.remove('open'); }
    function closeCustomModal() { const m = document.getElementById('custom-modal'); if (m) m.classList.remove('open'); }

    function openPrintExportModal(examId, showAnswers) {
      const exam = APP_STATE.exams.find(e => e.id === examId);
      if (!exam) return;
      const questions = exam.questionIds.map(id => APP_STATE.questions.find(q => q.id === id)).filter(Boolean);
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;

      box.innerHTML = `
        <div class="no-print" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
          <div style="display:flex;gap:8px;">
            <button type="button" class="mm-btn ${!showAnswers ? 'mm-btn-primary' : 'mm-btn-outline'} mm-btn-sm" onclick="openPrintExportModal('${exam.id}', false)">📄 Đề Học Sinh (Ẩn Đ/A)</button>
            <button type="button" class="mm-btn ${showAnswers ? 'mm-btn-primary' : 'mm-btn-outline'} mm-btn-sm" onclick="openPrintExportModal('${exam.id}', true)">🔑 Đáp Án & Giải</button>
          </div>
          <div style="display:flex;gap:8px;">
            <button type="button" class="mm-btn mm-btn-emerald mm-btn-sm" onclick="window.print()">🖨️ In / Lưu PDF</button>
            <button type="button" class="mm-btn mm-btn-outline mm-btn-sm" onclick="closeCustomModal()">Đóng ✕</button>
          </div>
        </div>
        <div style="border:1px solid var(--border-color);padding:16px;border-radius:10px;">
          <div style="border-bottom:2px solid var(--text-main);padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;">
            <div><strong>MATHMASTER THCS</strong><div style="font-size:12px;">Toán Lớp ${exam.grade} • ${getTextbookName(exam.textbook)}</div></div>
            <div style="text-align:right;"><strong>${exam.title}</strong><div style="font-size:12px;">Mã đề: #${exam.examCode} • ${exam.durationMinutes} phút</div></div>
          </div>
          ${questions.map((q, idx) => `
            <div style="padding:10px 0;border-bottom:1px dashed var(--border-color);">
              <div style="font-weight:700;">Câu ${idx + 1}: ${formatMathText(q.content)}</div>
              ${q.type === 'mcq' ? `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:4px;">${(q.options || []).map(o => `<div><strong>${o.label}.</strong> ${formatMathText(o.text)}</div>`).join('')}</div>` : ''}
              ${showAnswers ? `<div style="margin-top:6px;padding:6px;background:var(--emerald-soft);border-radius:6px;font-size:12.5px;"><strong>Đáp án: ${formatMathText('$' + q.correctAnswer + '$')}</strong> — ${formatMathText(q.solution)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
      modal.classList.add('open');
    }

    function openAddQuestionModal(defaultGrade, defaultChapterId) {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;
      const g = Number(defaultGrade || getCurrentUser().currentGrade || 8);
      const gMeta = getGradeMeta(g);
      box.innerHTML = `
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <h3 style="font-size:17px;font-weight:800;">Thêm Câu Hỏi Mới (Có kiểm tra trùng)</h3>
          <button type="button" class="mm-btn mm-btn-outline mm-btn-sm" onclick="closeCustomModal()">Đóng ✕</button>
        </div>
        <div class="mm-grid-2" style="margin-bottom:8px;">
          <select id="add-q-grade" class="mm-select"><option value="6" ${g === 6 ? 'selected' : ''}>Lớp 6</option><option value="7" ${g === 7 ? 'selected' : ''}>Lớp 7</option><option value="8" ${g === 8 ? 'selected' : ''}>Lớp 8</option><option value="9" ${g === 9 ? 'selected' : ''}>Lớp 9</option></select>
          <select id="add-q-chapter" class="mm-select">${gMeta.chapters.map(c => `<option value="${c.id}" ${c.id === defaultChapterId ? 'selected' : ''}>${c.title}</option>`).join('')}</select>
        </div>
        <textarea id="add-q-content" class="mm-textarea" rows="2" style="margin-bottom:8px;" placeholder="Nội dung câu hỏi..." oninput="checkDuplicateQuestionRealtime(this.value)"></textarea>
        <div id="add-q-dup-warning" style="display:none;margin-bottom:8px;padding:6px;background:var(--amber-soft);color:var(--amber);border-radius:6px;font-size:12px;"></div>
        <input type="text" id="add-q-ans" class="mm-input" style="margin-bottom:8px;" placeholder="Đáp án chuẩn...">
        <textarea id="add-q-sol" class="mm-textarea" rows="2" style="margin-bottom:10px;" placeholder="Lời giải từng bước..."></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;"><button type="button" class="mm-btn mm-btn-primary" onclick="saveNewQuestionFromModal()">✓ Lưu câu hỏi</button></div>
      `;
      modal.classList.add('open');
    }

    function checkDuplicateQuestionRealtime(text) {
      const warnEl = document.getElementById('add-q-dup-warning');
      if (!warnEl) return;
      const clean = String(text || '').trim().toLowerCase();
      if (clean.length < 10) { warnEl.style.display = 'none'; return; }
      const match = APP_STATE.questions.find(q => q.content.toLowerCase().includes(clean.slice(0, 16)));
      if (match) { warnEl.style.display = 'block'; warnEl.textContent = '⚠️ Phát hiện câu hỏi tương tự: ' + match.code; }
      else warnEl.style.display = 'none';
    }

    function saveNewQuestionFromModal() {
      const content = ((document.getElementById('add-q-content') || {}).value || '').trim();
      const ans = ((document.getElementById('add-q-ans') || {}).value || '').trim();
      if (!content || !ans) { showToast('Vui lòng nhập nội dung và đáp án!', 'warning'); return; }
      const g = Number((document.getElementById('add-q-grade') || {}).value || 8);
      const chId = (document.getElementById('add-q-chapter') || {}).value || ('G' + g + '_C1');
      const sol = ((document.getElementById('add-q-sol') || {}).value || 'Giải theo quy tắc chuẩn.').trim();
      APP_STATE.questions.unshift({
        id: 'Q_USR_' + Date.now(), code: 'M' + g + '-USR-' + Math.floor(100 + Math.random() * 899),
        grade: g, textbooks: ['KNTT', 'CD', 'CTST'], semester: 1, chapterId: chId,
        lesson: 'Bổ sung', topic: 'Chủ đề bổ sung', problemType: 'Tự luận',
        type: 'essay', difficulty: 'medium', cognitiveLevel: 'van_dung', points: 2.0,
        content: content, options: [], correctAnswer: ans, acceptedAnswers: [ans],
        solution: sol, rubricSteps: [{ step: sol, points: 2.0 }],
        keyFormula: 'Chương ' + chId, commonMistake: 'Kiểm tra ĐK', source: 'Người dùng thêm',
        verificationStatus: 'verified', version: 1
      });
      persistDatabase('add_q');
      closeCustomModal();
      renderCurrentView();
      showToast('Đã thêm câu hỏi mới!', 'success');
    }

    function openEditQuestionModal(qId) {
      const q = APP_STATE.questions.find(item => item.id === qId);
      if (!q) return;
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;
      box.innerHTML = `
        <h3 style="font-size:17px;font-weight:800;margin-bottom:10px;">Sửa Câu hỏi ${q.code} (v${q.version || 1})</h3>
        <textarea id="edit-q-content" class="mm-textarea" rows="3" style="margin-bottom:8px;">${q.content}</textarea>
        <input type="text" id="edit-q-ans" class="mm-input" style="margin-bottom:8px;" value="${q.correctAnswer}">
        <textarea id="edit-q-sol" class="mm-textarea" rows="2" style="margin-bottom:10px;">${q.solution}</textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" class="mm-btn mm-btn-outline" onclick="closeCustomModal()">Hủy</button>
          <button type="button" class="mm-btn mm-btn-primary" onclick="saveEditedQuestion('${q.id}')">Lưu v${(q.version || 1) + 1}</button>
        </div>
      `;
      modal.classList.add('open');
    }

    function saveEditedQuestion(qId) {
      const q = APP_STATE.questions.find(item => item.id === qId);
      if (!q) return;
      q.content = ((document.getElementById('edit-q-content') || {}).value || q.content).trim();
      q.correctAnswer = ((document.getElementById('edit-q-ans') || {}).value || q.correctAnswer).trim();
      q.solution = ((document.getElementById('edit-q-sol') || {}).value || q.solution).trim();
      q.version = (q.version || 1) + 1;
      persistDatabase('edit_q');
      closeCustomModal();
      renderCurrentView();
      showToast('Đã cập nhật phiên bản v' + q.version, 'success');
    }

    function openAddChapterLessonModal(gradeNum) {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;
      const gMeta = getGradeMeta(gradeNum);
      box.innerHTML = `
        <h3 style="font-size:17px;font-weight:800;margin-bottom:10px;">Bổ sung Bài học mới (Lớp ${gradeNum})</h3>
        <select id="add-les-ch" class="mm-select" style="margin-bottom:8px;">${gMeta.chapters.map(c => `<option value="${c.id}">${c.title}</option>`).join('')}</select>
        <input type="text" id="add-les-title" class="mm-input" style="margin-bottom:10px;" placeholder="Tên bài học mới...">
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" class="mm-btn mm-btn-outline" onclick="closeCustomModal()">Hủy</button>
          <button type="button" class="mm-btn mm-btn-primary" onclick="saveNewLessonToChapter(${gradeNum})">✓ Thêm bài học</button>
        </div>
      `;
      modal.classList.add('open');
    }

    function saveNewLessonToChapter(gradeNum) {
      const chId = (document.getElementById('add-les-ch') || {}).value;
      const title = ((document.getElementById('add-les-title') || {}).value || '').trim();
      const ch = getChapterMeta(chId);
      if (ch && title) {
        ch.lessons.push(title);
        closeCustomModal();
        renderCurrentView();
        showToast('Đã thêm bài học "' + title + '"', 'success');
      }
    }

    function openAddGoalModal() {
      const modal = document.getElementById('custom-modal');
      const box = document.getElementById('custom-modal-content');
      if (!modal || !box) return;
      box.innerHTML = `
        <h3 style="font-size:17px;font-weight:800;margin-bottom:10px;">Đặt Mục tiêu Học tập Mới</h3>
        <input type="text" id="new-goal-title" class="mm-input" style="margin-bottom:8px;" placeholder="VD: Hoàn thành 3 đề tuần này">
        <input type="number" id="new-goal-target" class="mm-input" style="margin-bottom:10px;" value="3" min="1">
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" class="mm-btn mm-btn-outline" onclick="closeCustomModal()">Hủy</button>
          <button type="button" class="mm-btn mm-btn-primary" onclick="saveNewGoalItem()">✓ Lưu mục tiêu</button>
        </div>
      `;
      modal.classList.add('open');
    }

    function saveNewGoalItem() {
      const title = ((document.getElementById('new-goal-title') || {}).value || '').trim();
      const target = Number((document.getElementById('new-goal-target') || {}).value || 3);
      if (!title) return;
      APP_STATE.learningGoals.push({ id: 'GOAL_' + Date.now(), userId: getCurrentUser().id, title: title, type: 'WEEKLY', current: 0, target: target, unit: 'đề', completed: false });
      persistDatabase('add_goal');
      closeCustomModal();
      renderCurrentView();
      showToast('Đã thêm mục tiêu học tập!', 'success');
    }

    window.addEventListener('DOMContentLoaded', function() {
      initDatabase();
      updateHeaderUI();
      renderCurrentView();
      checkBackendHealthAndSync(false);
    });

  </script>
</body>
</html>
